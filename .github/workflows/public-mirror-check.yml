name: Public mirror validation

on:
  pull_request:
    paths:
      - '.github/tidelight-mirrors.json'
      - '.github/workflows/**'
      - 'public/components/**'
      - 'docs/tic-openapi.yaml'
      - 'sdk/typescript/**'
      - 'sdk/python/**'
      - 'packages/react/**'
      - 'packages/cli/**'
      - 'scripts/check-public-mirrors.mjs'
      - 'scripts/public-mirror-files.mjs'
      - 'scripts/sync-public-mirrors.mjs'
      - 'tests/public-mirrors.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/tidelight-mirrors.json'
      - '.github/workflows/**'
      - 'public/components/**'
      - 'docs/tic-openapi.yaml'
      - 'sdk/typescript/**'
      - 'sdk/python/**'
      - 'packages/react/**'
      - 'packages/cli/**'
      - 'scripts/check-public-mirrors.mjs'
      - 'scripts/public-mirror-files.mjs'
      - 'scripts/sync-public-mirrors.mjs'
      - 'tests/public-mirrors.test.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Validate public source boundaries
        run: node scripts/check-public-mirrors.mjs
      - name: Test TypeScript SDK
        run: npm ci --prefix sdk/typescript && npm test --prefix sdk/typescript && (cd sdk/typescript && npm pack --dry-run --json)
      - name: Test React integration and validate packed files
        run: npm ci --prefix packages/react && npm test --prefix packages/react && (cd packages/react && npm pack --dry-run --json)
      - name: Test CLI and validate packed files
        run: npm ci --prefix packages/cli && npm test --prefix packages/cli && (cd packages/cli && npm pack --dry-run --json)
      - name: Test Python SDK
        run: PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
      - name: Test MCP package and validate packed files
        run: npm ci --prefix public/components/mcp/server && npm test --prefix public/components/mcp/server && cd public/components/mcp/server && npm pack --dry-run --json
      - name: Test public API contract
        run: npm ci --prefix public/components/api && npm test --prefix public/components/api
      - name: Test API examples
        run: npm test --prefix public/components/examples && npm run test:python --prefix public/components/examples

