name: Public mirror validation

on:
  pull_request:
    paths:
      - '.github/tidelight-mirrors.json'
      - '.github/workflows/**'
      - 'public/components/**'
      - 'docs/tic-openapi.yaml'
      - 'sdk/typescript/**'
      - 'sdk/python/**'
      - 'packages/react/**'
      - 'packages/cli/**'
      - 'scripts/check-public-mirrors.mjs'
      - 'scripts/public-mirror-files.mjs'
      - 'scripts/sync-public-mirrors.mjs'
      - 'scripts/check-python-package.py'
      - 'scripts/check-npm-package-archive.mjs'
      - 'scripts/test-package-consumers.mjs'
      - 'tests/npm-package-archive.test.mjs'
      - 'tests/public-mirrors.test.mjs'
      - 'app/developers/packages/**'
      - 'scripts/generate-developer-package-catalog.mjs'
      - 'tests/developer-package-catalog.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/tidelight-mirrors.json'
      - '.github/workflows/**'
      - 'public/components/**'
      - 'docs/tic-openapi.yaml'
      - 'sdk/typescript/**'
      - 'sdk/python/**'
      - 'packages/react/**'
      - 'packages/cli/**'
      - 'scripts/check-public-mirrors.mjs'
      - 'scripts/public-mirror-files.mjs'
      - 'scripts/sync-public-mirrors.mjs'
      - 'scripts/check-python-package.py'
      - 'scripts/check-npm-package-archive.mjs'
      - 'scripts/test-package-consumers.mjs'
      - 'tests/npm-package-archive.test.mjs'
      - 'tests/public-mirrors.test.mjs'
      - 'app/developers/packages/**'
      - 'scripts/generate-developer-package-catalog.mjs'
      - 'tests/developer-package-catalog.test.mjs'

permissions:
  contents: read

jobs:
  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test Python SDK source and built wheel
        run: |
          PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
          python scripts/check-python-package.py sdk/python

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Validate public source boundaries
        run: node scripts/check-public-mirrors.mjs
      - name: Verify developer package catalog is current
        run: npm run check:package-catalog
      - name: Test TypeScript SDK archive
        run: npm ci --prefix sdk/typescript && npm test --prefix sdk/typescript && node scripts/check-npm-package-archive.mjs sdk/typescript
      - name: Test React integration and validate packed files
        run: npm ci --prefix packages/react && npm test --prefix packages/react && node scripts/check-npm-package-archive.mjs packages/react
      - name: Test CLI and validate packed files
        run: npm ci --prefix packages/cli && npm test --prefix packages/cli && node scripts/check-npm-package-archive.mjs packages/cli
      - name: Install packed SDK, React and CLI into clean consumer projects
        run: node scripts/test-package-consumers.mjs
      - name: Test Python SDK and validate wheel
        run: |
          PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
          python scripts/check-python-package.py sdk/python
      - name: Test MCP package and validate packed files
        run: npm ci --prefix public/components/mcp/server && npm test --prefix public/components/mcp/server && node scripts/check-npm-package-archive.mjs public/components/mcp/server
      - name: Test public API contract
        run: npm ci --prefix public/components/api && npm test --prefix public/components/api
      - name: Test API examples
        run: npm test --prefix public/components/examples && npm run test:python --prefix public/components/examples

