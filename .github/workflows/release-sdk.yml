name: Tidelight package source release

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: Package source mirror to release
        required: true
        type: choice
        options: [typescript, python, mcp]
      version:
        description: Exact version already present in the synchronized package manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Validate version and run SDK tests
        id: version
        env:
          SDK: ${{ inputs.sdk }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node scripts/check-public-mirrors.mjs
          if [[ "$SDK" == "typescript" ]]; then
            VERSION=$(node -p "require('./sdk/typescript/package.json').version")
            npm test --prefix sdk/typescript
            node scripts/check-npm-package-archive.mjs sdk/typescript
            REPO=tidelight-sdk
          elif [[ "$SDK" == "python" ]]; then
            VERSION=$(python -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('sdk/python/pyproject.toml').read(), re.M).group(1))")
            PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
            python scripts/check-python-package.py sdk/python
            REPO=tidelight-python
          else
            VERSION=$(node -p "require('./public/components/mcp/server/package.json').version")
            npm ci --prefix public/components/mcp/server
            npm test --prefix public/components/mcp/server
            node scripts/check-npm-package-archive.mjs public/components/mcp/server
            REPO=tidelight-mcp
          fi
          [[ "$VERSION" == "$REQUESTED_VERSION" ]] || { echo "Requested version must match canonical SDK version $VERSION"; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "Version must follow SemVer"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
      - name: Clone selected mirror and verify canonical file parity
        id: parity
        env:
          SDK: ${{ inputs.sdk }}
          REPOSITORY: TidelightOrg/${{ steps.version.outputs.repo }}
        run: |
          git clone --depth 1 "https://github.com/$REPOSITORY.git" sdk-mirror
          node scripts/check-mirror-parity.mjs "$SDK" sdk-mirror
          MIRROR_SHA=$(git -C sdk-mirror rev-parse HEAD)
          CANONICAL_SHA=$(git rev-parse HEAD)
          echo "mirror_sha=$MIRROR_SHA" >> "$GITHUB_OUTPUT"
          echo "canonical_sha=$CANONICAL_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify synchronized package without release credentials
        id: mirror-verification
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd sdk-mirror
          if [[ "${{ inputs.sdk }}" == "typescript" ]]; then
            npm install --ignore-scripts --no-audit --no-fund
            MIRROR_VERSION=$(node -p "require('./package.json').version")
            npm test
            node "$GITHUB_WORKSPACE/scripts/check-npm-package-archive.mjs" .
          elif [[ "${{ inputs.sdk }}" == "python" ]]; then
            MIRROR_VERSION=$(python -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
            PYTHONPATH=src python -m unittest discover -s tests -v
            python "$GITHUB_WORKSPACE/scripts/check-python-package.py" .
          else
            cd server
            npm ci
            MIRROR_VERSION=$(node -p "require('./package.json').version")
            npm test
            node "$GITHUB_WORKSPACE/scripts/check-npm-package-archive.mjs" .
          fi
          [[ "$MIRROR_VERSION" == "$VERSION" ]] || { echo "Synchronized mirror version $MIRROR_VERSION does not match canonical version $VERSION"; exit 1; }
          TARGET_SHA=$(git rev-parse HEAD)
          [[ "$TARGET_SHA" == "${{ steps.parity.outputs.mirror_sha }}" ]] || { echo "Mirror changed after parity validation; refusing to tag a different commit"; exit 1; }
          if [[ "${{ inputs.sdk }}" == "mcp" ]]; then PACKAGE="MCP"; else PACKAGE="SDK"; fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TIDELIGHT_SYNC_APP_ID }}
          private-key: ${{ secrets.TIDELIGHT_SYNC_APP_PRIVATE_KEY }}
          owner: TidelightOrg
          repositories: ${{ steps.version.outputs.repo }}
          permission-contents: write
      - name: Publish verified source release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: TidelightOrg/${{ steps.version.outputs.repo }}
          TARGET_SHA: ${{ steps.mirror-verification.outputs.target_sha }}
          PACKAGE: ${{ steps.mirror-verification.outputs.package }}
          CANONICAL_SHA: ${{ steps.parity.outputs.canonical_sha }}
        run: |
          NOTES=$(printf 'Mother repository commit: %s\nTested mirror commit: %s\n\nThis release was created from byte-for-byte source verified against the Tidelight mother repository.' "$CANONICAL_SHA" "$TARGET_SHA")
          gh release create "v$VERSION" --repo "$REPOSITORY" --target "$TARGET_SHA" --title "Tidelight $PACKAGE v$VERSION" --notes "$NOTES"

