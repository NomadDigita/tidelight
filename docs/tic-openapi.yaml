openapi: 3.1.0
info:
  title: Tidelight Intelligence Cloud API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://tidelight.app/terms
  description: The versioned developer API exposes permission scoped asynchronous research jobs and market data only where the provider's redistribution terms permit it. Tokenized equity spot data is distinct from underlying US stock and perpetual contract data. Bitget-backed market data returns 503 with provider_terms_unconfirmed until written redistribution authorization is configured.
servers:
  - url: https://api.tidelight.app/v1
security:
  - tidelightKey: []
paths:
  /market/instruments:
    get:
      operationId: listTokenizedEquityInstruments
      summary: List verified tokenized equity spot instruments
      parameters:
        - name: kind
          in: query
          schema: { type: string, const: rtoken, default: rtoken }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: underlying_ticker
          in: query
          description: Filter Reality spot instruments by their underlying US stock ticker before pagination.
          schema: { type: string, pattern: '^[A-Za-z][A-Za-z0-9.]{0,9}$' }
        - name: cursor
          in: query
          schema: { type: string, pattern: '^[A-Z0-9]{2,32}$' }
      responses:
        '200':
          description: A page of instruments from Bitget Reality spot, only when redistribution is authorized
          headers:
            X-Request-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, generated_at, request_id]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Instrument' } }
                  next_cursor: { type: [string, 'null'] }
                  generated_at: { type: integer, description: Unix milliseconds when the provider data was assembled }
                  request_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: Upstream is unavailable or provider redistribution authorization is not configured (provider_terms_unconfirmed).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message, request_id]
                    properties:
                      code: { type: string, enum: [provider_unavailable, provider_terms_unconfirmed] }
                      message: { type: string }
                      request_id: { type: string, format: uuid }
  /research/jobs:
    post:
      operationId: startCompanySnapshot
      summary: Start an asynchronous company research snapshot
      description: Requires a key with research:run. Each project can create up to 10 jobs per rolling hour. Reusing an Idempotency-Key with the same ticker returns the existing job.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker]
              properties:
                ticker: { type: string, description: Supported US stock ticker, example: NVDA }
      responses:
        '202':
          description: New research snapshot queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResearchJobResponse'
        '200':
          description: Existing idempotent job returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartResearchJobResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /research/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getResearchJob
      summary: Get a research job status and completed snapshot
      responses:
        '200':
          description: Job status; result is present only after successful completion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchJob' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      operationId: cancelResearchJob
      summary: Cancel a queued job or request cancellation of a running job
      responses:
        '202':
          description: Cancellation accepted or requested for a running job
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status, request_id]
                properties:
                  job_id: { type: string, format: uuid }
                  status: { type: string, enum: [cancelled, cancellation_requested] }
                  request_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /webhooks:
    get:
      operationId: listWebhooks
      summary: List webhook endpoints in the API key's project
      description: Requires alerts:manage. Endpoint secrets are never returned by list operations.
      responses:
        '200':
          description: Project webhook endpoints
          content:
            application/json:
              schema:
                type: object
                required: [endpoints, request_id]
                properties:
                  endpoints: { type: array, items: { $ref: '#/components/schemas/WebhookEndpoint' } }
                  request_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createWebhook
      summary: Register a signed webhook endpoint
      description: Requires alerts:manage. Destinations must use public HTTPS on port 443 and pass DNS-based SSRF checks. The signing secret is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, events]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                url: { type: string, format: uri, maxLength: 2048 }
                events:
                  type: array
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '201':
          description: Endpoint created. Store signing_secret securely; it will not be returned again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookMutationResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /webhooks/{endpoint_id}:
    parameters:
      - name: endpoint_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateWebhook
      summary: Update, disable, or rotate a webhook endpoint
      description: Requires alerts:manage. A rotated signing secret is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                url: { type: string, format: uri, maxLength: 2048 }
                events:
                  type: array
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/WebhookEvent' }
                enabled: { type: boolean }
                rotate_secret: { type: boolean, const: true }
      responses:
        '200':
          description: Endpoint updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookMutationResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: disableWebhook
      summary: Disable a webhook endpoint and cancel pending deliveries
      responses:
        '200':
          description: Endpoint disabled
          content:
            application/json:
              schema:
                type: object
                required: [disabled, request_id]
                properties:
                  disabled: { type: boolean, const: true }
                  request_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /webhooks/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List the latest 100 webhook deliveries for this project
      description: Requires alerts:manage. Includes attempt summaries and bounded event payloads.
      responses:
        '200':
          description: Recent deliveries
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, request_id]
                properties:
                  deliveries: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/WebhookDelivery' } }
                  request_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    tidelightKey: { type: http, scheme: bearer, bearerFormat: Tidelight API key }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, request_id]
                properties:
                  code: { type: string }
                  message: { type: string }
                  request_id: { type: string, format: uuid }
  schemas:
    StartResearchJobResponse:
      type: object
      required: [job_id, status, duplicate, request_id]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, retry_wait, complete, failed, cancelled] }
        duplicate: { type: boolean }
        request_id: { type: string, format: uuid }
    ResearchJob:
      type: object
      required: [job_id, ticker, status, attempts, max_attempts, result, request_id]
      properties:
        job_id: { type: string, format: uuid }
        ticker: { type: string }
        status: { type: string, enum: [queued, running, retry_wait, complete, failed, cancelled] }
        attempts: { type: integer, minimum: 0, maximum: 3 }
        max_attempts: { type: integer, const: 3 }
        result: { oneOf: [{ $ref: '#/components/schemas/CompanySnapshot' }, { type: 'null' }] }
        error: { oneOf: [{ $ref: '#/components/schemas/ApiError' }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        retry_at: { type: [string, 'null'], format: date-time }
        request_id: { type: string, format: uuid }
    CompanySnapshot:
      type: object
      required: [type, ticker, generated_at, market, evidence, limitations]
      properties:
        type: { type: string, const: company_snapshot }
        ticker: { type: string }
        generated_at: { type: string, format: date-time }
        market:
          type: object
          required: [tokenized_equity_spot, stock_perpetual]
          properties:
            tokenized_equity_spot: { type: array, items: { $ref: '#/components/schemas/Instrument' } }
            stock_perpetual: { oneOf: [{ $ref: '#/components/schemas/StockPerpetual' }, { type: 'null' }] }
        evidence:
          type: object
          required: [mode, note, items]
          properties:
            mode: { type: string, const: headline_discovery }
            note: { type: string }
            items: { type: array, items: { $ref: '#/components/schemas/HeadlineReference' } }
        limitations: { type: array, items: { type: string } }
    StockPerpetual:
      type: object
      required: [symbol, instrument_type, underlying_ticker, issuer_name, quote_currency, last_price, change_24h, provider_timestamp, source]
      properties:
        symbol: { type: string }
        instrument_type: { type: string, const: stock_perpetual }
        underlying_ticker: { type: string }
        issuer_name: { type: string }
        quote_currency: { type: string }
        last_price: { type: number }
        change_24h: { type: [number, 'null'] }
        provider_timestamp: { type: [integer, 'null'] }
        source: { type: string, const: Bitget USDT perpetual }
    HeadlineReference:
      type: object
      required: [title, url, publisher, published_at, snippet, discovered_via]
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        publisher: { type: string }
        published_at: { type: [string, 'null'], format: date-time }
        snippet: { type: string }
        discovered_via: { type: string }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Instrument:
      type: object
      required: [symbol, instrument_type, underlying_ticker, issuer_name, quote_currency, last_price, change_24h, provider_timestamp, market_session_status, source]
      properties:
        symbol: { type: string }
        instrument_type: { type: string, const: tokenized_equity_spot }
        underlying_ticker: { type: string }
        issuer_name: { type: string }
        quote_currency: { type: string }
        last_price: { type: number }
        change_24h: { type: [number, 'null'] }
        provider_timestamp: { type: [integer, 'null'] }
        market_session_status: { type: string, enum: [available, unavailable] }
        source: { type: string, const: Bitget Reality spot }
    WebhookEvent:
      type: string
      enum: [research.job.completed, research.job.failed]
    WebhookEndpoint:
      type: object
      required: [id, project_id, organization_id, name, url, events, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri }
        events: { type: array, items: { $ref: '#/components/schemas/WebhookEvent' } }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookMutationResponse:
      type: object
      required: [endpoint, request_id]
      properties:
        endpoint: { $ref: '#/components/schemas/WebhookEndpoint' }
        signing_secret:
          type: string
          description: Present only on create or rotation; retain securely because it is not returned again.
        request_id: { type: string, format: uuid }
    WebhookDelivery:
      type: object
      required: [id, endpoint_id, project_id, event_id, event_type, payload, status, attempt_count, last_status_code, last_error_code, last_duration_ms, created_at, completed_at, tic_webhook_delivery_attempts, endpoint_name]
      properties:
        id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        event_type: { $ref: '#/components/schemas/WebhookEvent' }
        payload: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, sending, retry_wait, succeeded, failed, cancelled] }
        attempt_count: { type: integer, minimum: 0, maximum: 8 }
        last_status_code: { type: [integer, 'null'] }
        last_error_code: { type: [string, 'null'] }
        last_duration_ms: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        endpoint_name: { type: string }
        tic_webhook_delivery_attempts:
          type: array
          items:
            type: object
            required: [attempt_number, status_code, duration_ms, error_code, created_at]
            properties:
              attempt_number: { type: integer }
              status_code: { type: [integer, 'null'] }
              duration_ms: { type: [integer, 'null'] }
              error_code: { type: [string, 'null'] }
              created_at: { type: string, format: date-time }
