<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Tidelight Intelligence Cloud research flow, mobile layout</title>
  <desc id="desc">A conceptual vertical flow showing a research signal gaining source context before passing through scoped API or MCP access. This is a decorative illustration, not a live request or service status.</desc>
  <defs>
    <linearGradient id="surface" x1="40" y1="20" x2="380" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#FBFCFA"/><stop offset="1" stop-color="#F2F6F3"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#E8F0EC" stop-opacity=".84"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9AE5C7"/><stop offset="1" stop-color="#4B9C81"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2D8A6"/><stop offset="1" stop-color="#C89E5C"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#74C7A4" stop-opacity=".18"/><stop offset="1" stop-color="#74C7A4" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173D32" flood-opacity=".07"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .bg{fill:url(#surface)}.panel{fill:url(#glass);stroke:#DDE7E1}.ink{fill:#19342D}.muted{fill:#75867F}.teal{fill:#528F79}.gold{fill:#BD9251}.line{stroke:#B6CFC3}.softline{stroke:#D9E5DE}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .route{stroke-dasharray:6 7;animation:routeFlow 8s linear infinite}.orbit{transform-origin:210px 313px;animation:orbit 46s linear infinite}.floatA{animation:float 6s ease-in-out infinite}.floatB{animation:float 7s ease-in-out -2s infinite}.floatC{animation:float 8s ease-in-out -3s infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite}.traveler{offset-path:path("M 210 208 C 210 230 210 245 210 268 C 210 302 210 321 210 342 C 210 374 210 401 210 423");animation:travel 8s cubic-bezier(.65,0,.35,1) infinite}
      @keyframes routeFlow{to{stroke-dashoffset:-104}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}@keyframes travel{0%{offset-distance:0%;opacity:0}10%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
      @media(prefers-reduced-motion:reduce){.route,.orbit,.floatA,.floatB,.floatC,.pulse,.traveler{animation:none!important}.traveler{display:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="418" height="618" rx="24" class="bg" stroke="#DCE6E0"/>
  <ellipse cx="210" cy="311" rx="186" ry="250" fill="url(#halo)"/>
  <path d="M210 184V446" class="softline" stroke-width="1"/>
  <path d="M210 184V446" class="route line" stroke-width="1.5"/>
  <ellipse cx="210" cy="313" rx="143" ry="214" class="orbit" stroke="#BBD6C9" stroke-opacity=".27" stroke-dasharray="2 10"/>
  <ellipse cx="210" cy="313" rx="112" ry="175" class="orbit" stroke="#D2B77F" stroke-opacity=".24" stroke-dasharray="1 14" style="animation-direction:reverse;animation-duration:58s"/>

  <g class="sans muted" font-size="11">
    <text x="24" y="34" class="mono teal" font-size="9">TIDELIGHT</text>
    <text x="396" y="34" text-anchor="end" class="mono muted" font-size="9">INTELLIGENCE CLOUD</text>
  </g>

  <g class="floatA" filter="url(#shadow)">
    <rect x="28" y="62" width="364" height="126" rx="16" class="panel"/>
    <text x="52" y="91" class="mono muted" font-size="10">01 / REQUEST</text>
    <text x="52" y="121" class="sans ink" font-size="18" font-weight="650">Research signal</text>
    <text x="52" y="147" class="sans muted" font-size="14">A question enters the workflow.</text>
    <rect x="52" y="160" width="145" height="20" rx="6" fill="#EDF4F0" stroke="#D9E5DE"/>
    <circle cx="65" cy="170" r="3" fill="url(#teal)" class="pulse"/>
    <text x="77" y="174" class="mono teal" font-size="9">REQUEST CONTEXT</text>
  </g>

  <g class="floatB" filter="url(#shadow)">
    <rect x="28" y="234" width="364" height="146" rx="18" class="panel"/>
    <text x="52" y="263" class="mono muted" font-size="10">02 / SOURCE CONTEXT</text>
    <circle cx="87" cy="316" r="34" fill="#EDF6F1" stroke="#C7DDD1"/>
    <circle cx="87" cy="316" r="24" stroke="#B7D6C6" stroke-dasharray="2 4"/>
    <path d="M73 316h28M87 302v28" stroke="#4C8D76" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="87" cy="316" r="5" fill="url(#teal)" filter="url(#glow)"/>
    <g class="floatC"><circle cx="58" cy="302" r="4" fill="url(#gold)"/><circle cx="116" cy="301" r="4" fill="url(#teal)"/><circle cx="70" cy="344" r="3.5" fill="#86BCA2"/><circle cx="106" cy="344" r="3.5" fill="#D3B270"/></g>
    <text x="142" y="311" class="sans ink" font-size="15" font-weight="620">Source-grounded</text>
    <text x="142" y="332" class="sans ink" font-size="15" font-weight="620">research context</text>
    <text x="142" y="355" class="sans muted" font-size="13">Evidence · provenance · counterviews</text>
  </g>

  <g class="floatC" filter="url(#shadow)">
    <rect x="28" y="426" width="364" height="116" rx="16" class="panel"/>
    <text x="52" y="455" class="mono muted" font-size="10">03 / SCOPED DELIVERY</text>
    <text x="52" y="484" class="sans ink" font-size="17" font-weight="650">Authorized output</text>
    <text x="52" y="505" class="sans muted" font-size="13">Only permitted tools can respond.</text>
    <rect x="282" y="516" width="44" height="18" rx="5" fill="#EDF4F0" stroke="#D9E5DE"/>
    <rect x="333" y="516" width="42" height="18" rx="5" fill="#F7F2E8" stroke="#E8DDC5"/>
    <text x="304" y="529" text-anchor="middle" class="mono teal" font-size="8">API</text>
    <text x="354" y="529" text-anchor="middle" class="mono gold" font-size="8">MCP</text>
  </g>

  <circle r="4.5" fill="#4E9B7F" class="traveler" filter="url(#glow)"/>
  <text x="210" y="570" text-anchor="middle" class="sans muted" font-size="13">Conceptual workflow · availability depends on service, data</text>
  <text x="210" y="587" text-anchor="middle" class="sans muted" font-size="13">access, and key permissions. Not a live request or status.</text>
</svg>
