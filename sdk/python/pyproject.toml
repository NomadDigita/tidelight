[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tidelight-sdk"
version = "0.1.0"
description = "Tidelight Intelligence Cloud Python client (unpublished)"
requires-python = ">=3.10"
readme = "README.md"
keywords = ["tidelight", "research", "market-intelligence", "webhooks"]
classifiers = ["Programming Language :: Python :: 3 :: Only"]
license = { text = "Proprietary" }

[project.urls]
Homepage = "https://tidelight.app/developers/packages/python"
Documentation = "https://dev.tidelight.app/api"
Repository = "https://github.com/TidelightOrg/tidelight/tree/main/sdk/python"
Issues = "https://github.com/TidelightOrg/tidelight/issues"

[tool.setuptools.packages.find]
where = ["src"]
